{% extends "base.html" %}
{% import "macros.html" as macros %}
{% block content %}
<section class="intro">
  {{ section.content | safe }}
</section>
{% set moves = get_section(path="moves/_index.md") %}
<section class="moves">
  <h2>Moves</h2>
  <ul class="move-list">
    {% for page in moves.pages %}{{ macros::move_line(page=page) }}{% endfor %}
  </ul>
</section>
{% endblock content %}
